[package]
name = "mawr-native-static"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[dependencies]
mawr-core = { path = "../mawr-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "rustls"] }
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "net", "sync", "time"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }

[dev-dependencies]
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
rustls-pemfile = "2.2.0"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "tls12"] }

[lints]
workspace = true
