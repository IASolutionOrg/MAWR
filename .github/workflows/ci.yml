name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with required components
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Run canonical verification
        run: cargo +stable xtask verify

  msrv:
    name: MSRV (Rust 1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the minimum supported Rust version
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
      - name: Run canonical verification on the MSRV
        run: cargo +1.85.0 xtask verify
