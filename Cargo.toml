[workspace]
members = [
    "crates/mawr-core",
    "crates/mawr-native-static",
    "crates/mawr-semantic-html",
    "crates/mawr-state",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/IASolutionOrg/MAWR"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
